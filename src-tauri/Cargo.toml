[package]
name = "hvdigital"
version = "0.1.0"
description = "Aplicación local para la gestión digital de hojas de vida y procesos de calificación"
authors = ["Marco Miranda"]
edition = "2024"

[lib]
# El sufijo `_lib` evita que el nombre de la biblioteca entre en conflicto
# con el binario de la aplicación, especialmente durante la compilación en Windows.
name = "hvdigital_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
